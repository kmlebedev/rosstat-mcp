name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    name: Manifest contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test manifests
        run: python3 -m unittest discover -s tests -v
